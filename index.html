<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      vite-error-overlay,
      [data-vite-dev-id],
      div[style*="z-index: 99999"],
      div[style*="z-index: 2147483647"] {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
    </style>
    <script>
      (function() {
        // 1. Intercept & Virtualize Vite HMR WebSocket so it never emits connection errors
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('localhost:3000') !== -1 ||
              urlStr.indexOf('127.0.0.1') !== -1 ||
              urlStr.indexOf('run.app') !== -1
            ) {
              var listeners = {};
              var mockWs = {
                url: urlStr,
                readyState: 1, // OPEN
                protocol: '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                close: function() { this.readyState = 3; },
                send: function() {},
                addEventListener: function(event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                },
                removeEventListener: function(event, handler) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              // Simulate immediate success handshake
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  try { mockWs.onopen({ type: 'open', target: mockWs }); } catch (e) {}
                }
                if (listeners['open']) {
                  listeners['open'].forEach(function(fn) {
                    try { fn({ type: 'open', target: mockWs }); } catch (e) {}
                  });
                }
              }, 10);
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        function isWsError(err) {
          if (!err) return false;
          var str = (err.message || err.reason || String(err) || '').toLowerCase();
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('failed to fetch') !== -1
          );
        }

        // Suppress console WebSocket / Vite HMR logs in environment
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a || ''); }).join(' ').toLowerCase();
          if (isWsError({ message: joined })) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a || ''); }).join(' ').toLowerCase();
          if (isWsError({ message: joined })) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            var ov = document.querySelectorAll('vite-error-overlay');
            ov.forEach(function(el) { el.remove(); });
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isWsError(e.error) || isWsError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            var ov = document.querySelectorAll('vite-error-overlay');
            ov.forEach(function(el) { el.remove(); });
          }
        }, true);

        // Continuous observer to clean up any overlay if dynamically injected
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              mutation.addedNodes.forEach(function(node) {
                if (node.nodeName && node.nodeName.toLowerCase() === 'vite-error-overlay') {
                  node.remove();
                }
              });
            });
          });
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.documentElement, { childList: true, subtree: true });
          });
          if (document.documentElement) {
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
        }
      })();
    </script>
